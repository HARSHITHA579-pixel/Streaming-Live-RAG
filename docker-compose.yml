version: '3.8'

services:
  streaming-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streaming_rag_app
    ports:
      - "8000:8000"
    volumes:
      # Mount logs and data directories for persistence and local inspection
      - ./logs:/app/logs
      - ./data:/app/data
      - ./corpus/raw_docs:/app/corpus/raw_docs
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    restart: unless-stopped
